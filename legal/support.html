<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問い合わせ｜一手箱</title><style>body{max-width:760px;margin:auto;padding:24px;font:16px/1.8 system-ui;background:#111;color:#eee}a{color:#e8bd6a}h1,h2{line-height:1.4}</style><body><a href="../index.html#tomorrow">← 一手箱へ戻る</a><h1>問い合わせ</h1><p><strong>窓口: 本人入力待ち</strong></p><p>販売開始前に、購入者が利用できるメールまたは問い合わせフォーム、受付時間、通常の返信目安を確定します。認証情報や個人情報をGitHubへ記録しません。</p><h2>問い合わせ時に伝える内容</h2><p>アプリversion、端末・OS・browser、問題が起きた画面、直前の操作をお知らせください。メモ本文やbackup JSONは、窓口から明示的に依頼されない限り送信しないでください。</p><h2>データ復旧</h2><p>端末内dataを運営側で直接復元することはできません。保存済みの一手箱backupがある場合は、設定画面の復元機能を利用してください。</p></body></html>
